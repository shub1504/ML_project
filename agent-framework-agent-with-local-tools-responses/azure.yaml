# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: agent-framework-agent-with-local-tools-responses
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    agent-framework-agent-with-local-tools-responses:
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An Agent Framework agent with local tools hosted by Foundry.
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: agent-framework-agent-with-local-tools-responses
        project: src/agent-framework-agent-with-local-tools-responses
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 10
                name: GlobalStandard
        endpoint: https://maternalrisk-foundry-uae-rg.services.ai.azure.com/api/projects/maternal_health_rsk
        host: azure.ai.project
